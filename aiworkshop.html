<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Camp Flow | Team OpenBox</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
        }

        /* Main App */
        .app-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #050505;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            border: none;

            /* Keeps the app behind the branding */
            z-index: 1;
        }

        /* Bottom Branding Banner */
        .openbox-banner {
            position: fixed;

            bottom: 0;
            left: 0;

            width: 100%;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(5, 5, 5, 0.92);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border-top: 1px solid rgba(255,255,255,0.15);

            z-index: 9999;

            color: white;

            font-size: 13px;
            font-weight: 600;

            letter-spacing: 2px;

            text-transform: uppercase;

            box-shadow:
                0 -5px 30px rgba(0,0,0,0.35);
        }

        .openbox-banner span {
            opacity: 0.7;
            margin-right: 8px;
        }

        .openbox-banner strong {
            letter-spacing: 2.5px;
        }

        /* Small OpenBox glowing dot */
        .openbox-dot {
            width: 7px;
            height: 7px;

            margin-right: 10px;

            border-radius: 50%;

            background: #ffffff;

            box-shadow:
                0 0 8px rgba(255,255,255,0.8),
                0 0 18px rgba(255,255,255,0.4);
        }

        /* Loading Screen */
        .loader {
            position: fixed;

            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #050505;

            z-index: 10000;

            transition: opacity 0.5s ease;
        }

        .loader-content {
            text-align: center;
            color: white;
        }

        .loader-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        .loader-subtitle {
            font-size: 12px;
            opacity: 0.5;
            letter-spacing: 1.5px;
        }

        .loading-line {
            width: 160px;
            height: 2px;

            margin: 22px auto 0;

            background: rgba(255,255,255,0.15);

            overflow: hidden;
        }

        .loading-line::after {
            content: "";

            display: block;

            width: 50%;
            height: 100%;

            background: white;

            animation: loading 1.2s infinite ease-in-out;
        }

        @keyframes loading {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(300%);
            }
        }

        /* Mobile */
        @media (max-width: 600px) {

            .openbox-banner {
                height: 42px;
                font-size: 10px;
                letter-spacing: 1.5px;
            }

            .openbox-banner strong {
                letter-spacing: 2px;
            }

            .openbox-dot {
                width: 6px;
                height: 6px;
                margin-right: 7px;
            }
        }

    </style>
</head>

<body>

    <!-- Loading screen -->
    <div class="loader" id="loader">

        <div class="loader-content">

            <div class="loader-title">
                AI CAMP FLOW
            </div>

            <div class="loader-subtitle">
                POWERED BY TEAM OPENBOX
            </div>

            <div class="loading-line"></div>

        </div>

    </div>


    <!-- Base44 App -->
    <div class="app-container">

        <iframe
            id="aiCampFrame"
            src="https://ai-camp-flow.base44.app/"
            title="AI Camp Flow"
            allow="camera; microphone; fullscreen; clipboard-read; clipboard-write"
            loading="eager">
        </iframe>

    </div>


    <!-- Team OpenBox Branding -->
    <div class="openbox-banner">

        <div class="openbox-dot"></div>

        <span>Made by</span>

        <strong>TEAM OPENBOX</strong>

    </div>


    <script>

        const iframe = document.getElementById("aiCampFrame");
        const loader = document.getElementById("loader");

        iframe.addEventListener("load", function () {

            setTimeout(() => {

                loader.style.opacity = "0";

                setTimeout(() => {
                    loader.style.display = "none";
                }, 500);

            }, 400);

        });

    </script>

</body>
</html>
