<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Camp Flow — Team OpenBox</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
}

.app {
    width: 100%;
    height: 100vh;
    position: relative;
}

iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

.fallback {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    background:
        radial-gradient(circle at center, #151515, #050505 70%);
}

.content {
    max-width: 500px;
}

.logo {
    font-size: 14px;
    letter-spacing: 4px;
    opacity: .6;
    margin-bottom: 20px;
}

h1 {
    font-size: 42px;
    margin-bottom: 12px;
}

p {
    opacity: .65;
    line-height: 1.6;
    margin-bottom: 30px;
}

.launch {
    display: inline-block;
    padding: 15px 28px;
    border-radius: 12px;
    background: white;
    color: black;
    text-decoration: none;
    font-weight: bold;
}

.banner {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 45px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.9);
    backdrop-filter: blur(10px);

    border-top: 1px solid rgba(255,255,255,.15);

    z-index: 100;
    
    font-size: 12px;
    letter-spacing: 2px;
}

.banner span {
    opacity: .55;
    margin-right: 7px;
}

.banner strong {
    letter-spacing: 3px;
}
</style>
</head>

<body>

<div class="app">

    <iframe
        id="appFrame"
        src="https://ai-camp-flow.base44.app/"
        title="AI Camp Flow">
    </iframe>

    <div class="fallback" id="fallback">

        <div class="content">

            <div class="logo">
                TEAM OPENBOX
            </div>

            <h1>AI CAMP FLOW</h1>

            <p>
                The workshop dashboard cannot be displayed
                inside this frame. Open the application directly
                to continue.
            </p>

            <a
                class="launch"
                href="https://ai-camp-flow.base44.app/"
                target="_blank">
                LAUNCH AI CAMP
            </a>

        </div>

    </div>

    <div class="banner">
        <span>MADE BY</span>
        <strong>TEAM OPENBOX</strong>
    </div>

</div>

</body>
</html>
